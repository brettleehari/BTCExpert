# Render.com Configuration
# Enables one-click deployment from GitHub
# Documentation: https://render.com/docs/infrastructure-as-code

services:
  # CIAL API Service
  - type: web
    name: cial-api
    runtime: docker
    repo: https://github.com/brettleehari/BTCExpert
    branch: main
    dockerfilePath: ./cial/Dockerfile
    dockerContext: ./cial
    region: oregon  # Options: oregon, ohio, virginia, frankfurt, singapore
    plan: free  # FREE tier - Upgrade to 'starter' ($7/mo) or 'standard' ($25/mo) for production
    numInstances: 1  # Increase to 2+ for production

    # Health check
    healthCheckPath: /health

    # Auto-deploy handled manually via scripts/render-deploy.sh
    autoDeploy: false

    # Environment variables
    envVars:
      - key: ENVIRONMENT
        value: production

      - key: DEBUG
        value: false

      - key: API_VERSION
        value: "1.0"

      - key: DATABASE_URL
        fromDatabase:
          name: cial-postgres
          property: connectionString

      - key: REDIS_URL
        fromDatabase:
          name: cial-redis
          property: connectionString

      - key: SECRET_KEY
        generateValue: true  # Auto-generates secure key

      - key: POSTGRES_HOST
        fromDatabase:
          name: cial-postgres
          property: host

      - key: POSTGRES_PORT
        fromDatabase:
          name: cial-postgres
          property: port

      - key: POSTGRES_DB
        fromDatabase:
          name: cial-postgres
          property: database

      - key: POSTGRES_USER
        fromDatabase:
          name: cial-postgres
          property: user

      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: cial-postgres
          property: password

      - key: REDIS_HOST
        fromDatabase:
          name: cial-redis
          property: host

      - key: REDIS_PORT
        fromDatabase:
          name: cial-redis
          property: port

      # Add your API keys here (set in Render dashboard)
      # - key: COINGECKO_API_KEY
      #   sync: false  # Set manually in dashboard

      # - key: SENTRY_DSN
      #   sync: false

# Databases
databases:
  # PostgreSQL 16 with pgvector
  - name: cial-postgres
    databaseName: cial
    plan: free  # FREE tier - Upgrade to 'starter' ($7/mo) or 'standard' ($25/mo) for production
    region: oregon
    postgresMajorVersion: 16

  # Redis 7
  - name: cial-redis
    plan: free  # FREE tier - Upgrade to 'starter' ($7/mo) or 'standard' ($25/mo) for production
    region: oregon
    # Note: maxmemoryPolicy is set to allkeys-lru by default by Render

# Note: Render doesn't provide managed Kafka
# Options:
# 1. Use CloudKarafka (free tier available): https://www.cloudkarafka.com/
# 2. Use Upstash Kafka (serverless): https://upstash.com/
# 3. Remove Kafka dependency for Render deployment
# 4. Use Redis Streams as Kafka alternative

# For production, you'll need to:
# 1. Set up external Kafka service
# 2. Add KAFKA_BOOTSTRAP_SERVERS to environment variables
# 3. Or modify code to make Kafka optional
