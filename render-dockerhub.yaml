# Render.com Configuration - Using Pre-built Docker Hub Images
# This configuration pulls images from Docker Hub instead of building from source
# Documentation: https://render.com/docs/infrastructure-as-code

services:
  # CIAL API Service - Deployed from Docker Hub
  - type: web
    name: cial-api
    runtime: image
    image:
      url: docker.io/YOUR_DOCKERHUB_USERNAME/cial:latest
      # Alternative versioned tag:
      # url: docker.io/YOUR_DOCKERHUB_USERNAME/cial:main-abc1234
    region: oregon
    plan: free
    numInstances: 1

    # Health check
    healthCheckPath: /health

    # Auto-deploy when new image pushed
    autoDeploy: true

    # Environment variables
    envVars:
      - key: ENVIRONMENT
        value: production

      - key: DEBUG
        value: false

      - key: API_VERSION
        value: "1.0"

      - key: DATABASE_URL
        fromDatabase:
          name: cial-postgres
          property: connectionString

      - key: REDIS_URL
        fromDatabase:
          name: cial-redis
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: POSTGRES_HOST
        fromDatabase:
          name: cial-postgres
          property: host

      - key: POSTGRES_PORT
        fromDatabase:
          name: cial-postgres
          property: port

      - key: POSTGRES_DB
        fromDatabase:
          name: cial-postgres
          property: database

      - key: POSTGRES_USER
        fromDatabase:
          name: cial-postgres
          property: user

      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: cial-postgres
          property: password

      - key: REDIS_HOST
        fromDatabase:
          name: cial-redis
          property: host

      - key: REDIS_PORT
        fromDatabase:
          name: cial-redis
          property: port

# Databases
databases:
  # PostgreSQL 16 with pgvector
  - name: cial-postgres
    databaseName: cial
    plan: free
    region: oregon
    postgresMajorVersion: 16

  # Redis 7
  - name: cial-redis
    plan: free
    region: oregon
