# Auto-approve and auto-merge Dependabot PRs
# Automatically merges Dependabot PRs after all CI checks pass

name: Dependabot Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Job 1: Auto-approve Dependabot PRs
  auto-approve:
    name: Auto-approve Dependabot PR
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    
    steps:
      - name: Approve PR
        uses: hmarr/auto-approve-action@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # Job 2: Enable auto-merge after CI passes
  auto-merge:
    name: Enable Auto-Merge
    runs-on: ubuntu-latest
    needs: auto-approve
    if: github.actor == 'dependabot[bot]'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get PR details
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get PR number and metadata
          PR_NUMBER="${{ github.event.pull_request.number }}"
          echo "pr_number=${PR_NUMBER}" >> $GITHUB_OUTPUT
          
          # Get update type from PR title
          PR_TITLE="${{ github.event.pull_request.title }}"
          echo "pr_title=${PR_TITLE}" >> $GITHUB_OUTPUT

      - name: Enable auto-merge for minor/patch updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ steps.pr.outputs.pr_number }}"
          PR_TITLE="${{ steps.pr.outputs.pr_title }}"
          
          # Check if it's a minor or patch update (not major)
          if echo "$PR_TITLE" | grep -qE "Bump .* from .* to .*"; then
            # Extract version numbers
            FROM_VERSION=$(echo "$PR_TITLE" | sed -n 's/.*from \([0-9.]*\).*/\1/p')
            TO_VERSION=$(echo "$PR_TITLE" | sed -n 's/.*to \([0-9.]*\).*/\1/p')
            
            FROM_MAJOR=$(echo "$FROM_VERSION" | cut -d. -f1)
            TO_MAJOR=$(echo "$TO_VERSION" | cut -d. -f1)
            
            echo "Update: $FROM_VERSION → $TO_VERSION"
            echo "Major version: $FROM_MAJOR → $TO_MAJOR"
            
            # Only auto-merge if major version hasn't changed
            if [ "$FROM_MAJOR" = "$TO_MAJOR" ]; then
              echo "✅ Minor/patch update detected - enabling auto-merge"
              gh pr merge "$PR_NUMBER" --auto --squash --delete-branch
            else
              echo "⚠️  Major version update detected - requires manual review"
              gh pr comment "$PR_NUMBER" --body "🔔 **Major version update detected** - This PR requires manual review before merging."
            fi
          else
            echo "✅ Enabling auto-merge for this Dependabot PR"
            gh pr merge "$PR_NUMBER" --auto --squash --delete-branch
          fi

  # Job 3: Add labels based on update type
  label-pr:
    name: Label Dependabot PR
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    
    steps:
      - name: Add labels based on update type
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title.toLowerCase();
            const labels = [];
            
            // Determine update severity
            if (title.includes('security')) {
              labels.push('security');
              labels.push('priority: high');
            }
            
            // Check for major version updates
            const match = title.match(/from (\d+)\.\d+\.\d+ to (\d+)\.\d+\.\d+/);
            if (match) {
              const fromMajor = parseInt(match[1]);
              const toMajor = parseInt(match[2]);
              
              if (toMajor > fromMajor) {
                labels.push('major-update');
                labels.push('needs-review');
              } else {
                labels.push('auto-mergeable');
              }
            }
            
            // Add labels to PR
            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: labels
              });
            }
