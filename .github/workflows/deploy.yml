# GitHub Actions CI/CD Pipeline for CIAL
# Automatically tests and deploys on push to main branch

name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'cial/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
    paths:
      - 'cial/**'

env:
  PYTHON_VERSION: '3.11.6'
  WORKING_DIR: './cial'

jobs:
  # ============================================================================
  # Job 1: Code Quality Checks
  # ============================================================================
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install linting tools
        run: |
          cd ${{ env.WORKING_DIR }}
          pip install black ruff

      - name: Run Black (format check)
        run: |
          cd ${{ env.WORKING_DIR }}
          black --check --diff .

      - name: Run Ruff (linting)
        run: |
          cd ${{ env.WORKING_DIR }}
          ruff check . --config=pyproject.toml

  # ============================================================================
  # Job 2: Security Scanning
  # ============================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: |
          cd ${{ env.WORKING_DIR }}
          pip install bandit safety

      - name: Run Bandit (security linting)
        run: |
          cd ${{ env.WORKING_DIR }}
          bandit -r . -f json -o bandit-report.json || true

      - name: Run Safety (dependency vulnerabilities)
        run: |
          cd ${{ env.WORKING_DIR }}
          safety check --json || true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            cial/bandit-report.json
          retention-days: 30

  # ============================================================================
  # Job 3: Automated Tests
  # ============================================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: [lint]

    # Test with multiple Python versions (optional)
    # strategy:
    #   matrix:
    #     python-version: ['3.11', '3.12']

    # Service containers for testing
    services:
      postgres:
        image: pgvector/pgvector:0.7.4-pg16
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd ${{ env.WORKING_DIR }}
          pip install -r requirements-dev.txt

      - name: Run pytest
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          SECRET_KEY: test-secret-key-min-32-chars-for-testing
          ENVIRONMENT: testing
        run: |
          cd ${{ env.WORKING_DIR }}
          pytest -v --cov=. --cov-report=xml --cov-report=html --cov-fail-under=50

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./cial/coverage.xml
          flags: unittests
          name: codecov-cial
          fail_ci_if_error: false

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            cial/coverage.xml
            cial/htmlcov/
          retention-days: 30

  # ============================================================================
  # Job 4: Build Docker Image
  # ============================================================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, security]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./cial
          file: ./cial/Dockerfile
          push: false
          tags: cial:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker run --rm cial:${{ github.sha }} python --version

  # ============================================================================
  # Job 5: Deploy to Production (Railway)
  # ============================================================================
  deploy-railway:
    name: Deploy to Railway (Production)
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: |
          cd ${{ env.WORKING_DIR }}
          railway up --service cial
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # ============================================================================
  # Job 6: Deploy to Google Cloud Run
  # ============================================================================
  deploy-gcp:
    name: Deploy to Google Cloud Run
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and Deploy to Cloud Run
        run: |
          cd ${{ env.WORKING_DIR }}
          gcloud builds submit --config cloudbuild.yaml .

  # ============================================================================
  # Job 7: Deploy to DigitalOcean App Platform
  # ============================================================================
  deploy-digitalocean:
    name: Deploy to DigitalOcean
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Update App Platform deployment
        run: |
          # Get app ID (or use a fixed app ID)
          APP_ID=$(doctl apps list --format ID --no-header | head -n 1)

          # Trigger redeployment
          doctl apps create-deployment $APP_ID

  # ============================================================================
  # Job 8: Deploy to Render.com
  # ============================================================================
  deploy-render:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Trigger Render deployment
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

  # ============================================================================
  # Job 9: Staging Deployment (Develop Branch)
  # ============================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging environment
        run: |
          echo "Deploying to staging..."
          # Add your staging deployment commands here

  # ============================================================================
  # Job 10: Notification
  # ============================================================================
  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [build]
    if: always() && github.ref == 'refs/heads/main'

    steps:
      - name: Send Slack notification
        run: |
          WEBHOOK_URL="${{ secrets.SLACK_WEBHOOK_URL }}"
          if [ -z "$WEBHOOK_URL" ]; then
            echo "⚠️  SLACK_WEBHOOK_URL not configured - skipping notification"
            exit 0
          fi

          STATUS="success"
          COLOR="good"
          if [ "${{ needs.build.result }}" != "success" ]; then
            STATUS="failed"
            COLOR="danger"
          fi

          curl -X POST "$WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d '{
              "attachments": [{
                "color": "'$COLOR'",
                "title": "CIAL Deployment",
                "text": "Deployment to production: '$STATUS'",
                "fields": [
                  {"title": "Branch", "value": "'"${{ github.ref_name }}"'", "short": true},
                  {"title": "Commit", "value": "'"${{ github.sha }}"'", "short": true}
                ]
              }]
            }'

# ============================================================================
# Required GitHub Secrets
# ============================================================================
#
# Add these in: GitHub Repo → Settings → Secrets and variables → Actions
#
# For Railway:
#   RAILWAY_TOKEN - Get from Railway dashboard → Account → Tokens
#
# For Google Cloud:
#   GCP_SA_KEY - Service account JSON key with roles:
#     - Cloud Build Editor
#     - Cloud Run Admin
#     - Service Account User
#     - Storage Admin
#
# For DigitalOcean:
#   DIGITALOCEAN_ACCESS_TOKEN - Get from DO dashboard → API → Tokens
#
# For Render:
#   RENDER_DEPLOY_HOOK_URL - Get from Render dashboard → Service → Settings
#
# For Notifications (optional):
#   SLACK_WEBHOOK_URL - Slack incoming webhook URL
#
# ============================================================================
