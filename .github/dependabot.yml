# Dependabot Configuration for CIAL
# Automatically checks for dependency updates and security vulnerabilities
# Works with dependabot-auto-merge.yml to automatically merge safe updates

version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/cial"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
      - "dependabot"
    commit-message:
      prefix: "deps"
      include: "scope"
    # Only update patch and minor versions automatically
    # Major versions require manual review
    versioning-strategy: increase-if-necessary
    # Group minor and patch updates together
    groups:
      python-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    
  # Docker dependencies
  - package-ecosystem: "docker"
    directory: "/cial"
    schedule:
      interval: "weekly"
      - "dependabot
      - "dependencies"
      - "docker"
    reviewers:
      - "cial-team"
    assignees:
      - "cial-team"
    commit-message:
      prefix: "doc
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "github-actions"
      - "dependabot"
    commit-message:
      prefix: "ci"
    # Group GitHub Actions updates
    groups:
      github-actions:
        patterns:
          - "*cies"
      - "github-actions"
    commit-message:
      prefix: "ci"
