# Pre-commit hooks configuration for CIAL
# Automatically runs code quality checks before commits
# Install: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Black - Python code formatter
  - repo: https://github.com/psf/black
    rev: 25.12.0
    hooks:
      - id: black
        language_version: python3.12
        args: ['--line-length=100']
        files: ^cial/.*\.py$

  # isort - Import sorting
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ['--profile=black', '--line-length=100']
        files: ^cial/.*\.py$

  # Ruff - Fast Python linter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff
        args: 
          - --fix
          - --config=cial/pyproject.toml
        files: ^cial/.*\.py$

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        files: ^cial/.*\.(py|yaml|yml|md)$
      - id: end-of-file-fixer
        files: ^cial/.*\.(py|yaml|yml|md)$
      - id: check-yaml
        files: ^cial/.*\.ya?ml$
      - id: check-json
        files: ^cial/.*\.json$
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ['--fix=lf']
        files: ^cial/.*\.py$

  # Bandit - Security linter
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.2
    hooks:
      - id: bandit
        args: ['-c', 'cial/pyproject.toml']
        files: ^cial/.*\.py$

  # YAML Lint
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint
        args: ['-d', '{extends: default, rules: {line-length: {max: 120}}}']
        files: ^cial/.*\.ya?ml$

# Configuration for specific hooks
default_language_version:
  python: python3.12

# Files to exclude from all hooks
exclude: |
  (?x)(
      ^cial/venv/|
      ^cial/__pycache__/|
      ^cial/\.pytest_cache/|
      ^cial/\.ruff_cache/|
      ^cial/htmlcov/|
      ^cial/\.coverage|
      ^\.git/
  )

# CI configuration
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks
    
    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false
